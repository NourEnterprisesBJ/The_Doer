name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Piper voice model
        run: |
          mkdir -p app/src/main/assets/piper
          curl -L -o app/src/main/assets/piper/fr_FR-siwis-medium.onnx https://github.com/NourEnterprisesBJ/The_Doer/releases/download/assets-piper-v1/fr_FR-siwis-medium.onnx
          curl -L -o app/src/main/assets/piper/fr_FR-siwis-medium.onnx.json https://github.com/NourEnterprisesBJ/The_Doer/releases/download/assets-piper-v1/fr_FR-siwis-medium.onnx.json

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
